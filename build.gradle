plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = "${project.archives_base_name}" }

loom {
    accessWidenerPath = file('src/main/resources/bep.accesswidener')

    mixin {
        useLegacyMixinAp = false
    }
}

repositories {
    maven {
        name = 'Meteor Releases'
        url = 'https://maven.meteordev.org/releases'
    }
    maven {
        name = 'Meteor Snapshots'
        url = 'https://maven.meteordev.org/snapshots'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Lenni0451'
        url = 'https://maven.lenni0451.net/releases'
    }
    maven {
        name = 'ViaVersion'
        url = 'https://repo.viaversion.com'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"

    modCompileOnly "meteordevelopment:baritone:${project.baritone_version}"

    modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
    modCompileOnly "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
    modCompileOnly "maven.modrinth:xaeroplus:${project.xaeroplus_version}"

    modCompileOnly "maven.modrinth:litematica:${project.litematica_version}"
    modCompileOnly "maven.modrinth:malilib:${project.malilib_version}"

    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'

    include implementation("net.lenni0451:LambdaEvents:${project.lambdaevents_version}")
    include implementation("com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}")
}

def targetJava = project.java_version as int

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
    toolchain { languageVersion = JavaLanguageVersion.of(targetJava) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJava
    options.compilerArgs += ['-Xlint:none', '-nowarn']
    options.deprecation = false
}

tasks.named('remapJar') {
    archiveBaseName = "${project.archives_base_name}"
    archiveVersion = "v${project.mod_version}-${project.minecraft_version}"
    archiveClassifier = ''
}

tasks.register('printCompileClasspath') {
    doLast {
        sourceSets.main.compileClasspath.files.each { println it.absolutePath }
    }
}
